[project]
name = "watchtower"
version = "0.1.0"
description = "Keyword sweep and monitoring across news, regulatory, social and sanctions sources"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27",
    "trafilatura>=1.12",
    "feedparser>=6.0",
    "PyYAML>=6.0",
    "anthropic>=0.40",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "dnspython>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "flake8>=7.0",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

# The app object lives in web/app.py, which is not one of the locations Vercel
# probes by default. requirements.txt stays the source of truth for local
# installs; the dependency list above is here because Vercel reads this file.
[tool.vercel]
entrypoint = "web.app:app"
